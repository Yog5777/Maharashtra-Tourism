<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery - Maharashtra Tourism</title>
    <!-- FontAwesome Library for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* --- Core Reset & Modern Base --- */
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: #f0f3f6;
            color: #333;
            line-height: 1.7;
        }

        /* --- Color Palette --- */
        :root {
            --primary-color: #1a4d2e; /* Dark Green */
            --accent-color: #4f772d;  /* Light Green */
            --bg-light: #ffffff;
            --text-muted: #555;
        }

        /* --- Main Title Header --- */
        header {
            background-color: #ffffff;
            padding: 25px 10px 15px 10px;
            text-align: center;
        }

        header h1 {
            color: var(--primary-color);
            font-size: 30px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 5px;
        }

        header p {
            color: var(--text-muted);
            font-size: 15px;
            font-weight: 400;
        }

        /* --- District Bar --- */
        .sub-header {
            background-color: var(--primary-color);
            color: white;
            padding: 12px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
        }

        .sub-header h2 {
            font-size: 22px;
            font-weight: 600;
            margin: 0 auto;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .back-btn {
            color: #ffffff;
            text-decoration: none;
            font-size: 14px;
            background-color: rgba(255, 255, 255, 0.15);
            padding: 6px 14px;
            border-radius: 5px;
            display: flex;
            align-items: center;
            gap: 8px;
            position: absolute;
            right: 30px;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background-color: #ffb703;
            color: var(--primary-color);
        }

        /* --- Single Column Full-Width Wrapper --- */
        .main-wrapper {
            max-width: 1000px;
            margin: 30px auto;
            background: var(--bg-light);
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            border-radius: 12px;
            padding: 40px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .gallery-item {
            background: #fff;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
            height: 250px;
        }

        .gallery-item:hover {
            transform: scale(1.03);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .section-title {
            color: var(--primary-color);
            font-size: 24px;
            margin-bottom: 10px;
            border-bottom: 2px solid var(--accent-color);
            display: inline-block;
            padding-bottom: 5px;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .main-wrapper {
                margin: 15px;
                padding: 20px;
            }
            .sub-header {
                flex-direction: column;
                gap: 10px;
            }
            .back-btn {
                position: static;
            }
        }
    </style>
</head>
<body>

    <!-- Main Title Header -->
    <header>
        <h1>WELCOME TO MAHARASHTRA TOURISM</h1>
        <p>Explore the diverse beauty and culture of our state.</p>
    </header>

    <!-- Sub-Header / Title Bar -->
    <div class="sub-header">
        <h2><i class="fas fa-images"></i> Photo Gallery</h2>
        <a href="Home.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Home</a>
    </div>

    <!-- Main Container Layout -->
    <div class="main-wrapper">
        <h3 class="section-title">Explore State Wonders</h3>
        
        <div class="gallery-grid">
            <!-- Gallery Items (आप चाहें तो अपनी खुद की इमेज का पाथ यहाँ बदल सकते हैं) -->
            <div class="gallery-item">
                <img src="https://images.unsplash.com/photo-1534188753412-3e26d0d618d6?auto=format&fit=crop&w=600&q=80" alt="Tadoba Tiger">
            </div>
            <div class="gallery-item">
                <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=600&q=80" alt="Gorewada Lake">
            </div>
            <div class="gallery-item">
                <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=600&q=80" alt="Maharashtra Nature">
            </div>
            <div class="gallery-item">
                <img src="https://images.unsplash.com/photo-1561731216-c3a4d99437d5?auto=format&fit=crop&w=600&q=80" alt="Wildlife">
            </div>
            <div class="gallery-item">
                <img src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&w=600&q=80" alt="Scenery">
            </div>
            <div class="gallery-item">
                <img src="https://images.unsplash.com/photo-1511497584788-876761197069?auto=format&fit=crop&w=600&q=80" alt="Forest View">
            </div>
        </div>
    </div>

</body>
</html>
